[project]
name = "personal-telemetry"
version = "0.1.0"
description = "Local-first personal telemetry & health data pipeline (DuckDB + Streamlit)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
telemetry = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core", "connectors", "analytics", "llm", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
